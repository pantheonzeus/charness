<style>
  /* The room: warm, calm, dark-first. Content sits on solid "paper"; glass is only the control layer.
     Every motion encodes real state and has a static twin (reduced motion / transparency). */
  :root {
    --room: #15130f; --room-2: #1c1914; --paper: #221f19; --paper-2: #2a261f; --ink: #efe7d8; --soft: #c9bfac;
    --muted: #8f8676; --line: #3a342a; --glow: #e8b45a; --speak: #f0c987; --cut: #8cc4e0;
    --cos: #e0a84a; --ana: #78a6c8; --res: #d0805f; --ops: #86b07c; --err: #e0705a;
    --glass: rgba(42, 37, 29, .62); --serif: ui-serif, "New York", "Iowan Old Style", Georgia, serif;
    --sans: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", sans-serif;
  }
  @media (prefers-color-scheme: light) {
    :root { --room: #efe8db; --room-2: #e8e0d1; --paper: #fbf7ef; --paper-2: #f3ede2; --ink: #23201b; --soft: #4a443a;
            --muted: #7d7464; --line: #d9cfbd; --glow: #c98a22; --speak: #b8781a; --glass: rgba(251, 247, 239, .7); }
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body { margin: 0; background: radial-gradient(120% 90% at 50% 40%, var(--room-2), var(--room)); color: var(--ink);
         font: 15px/1.55 var(--sans); overflow: hidden; }

  button { font: inherit; color: inherit; }
  .meta { color: var(--muted); font-size: 12px; } .err { color: var(--err); } .ok { color: var(--ops); }
  .hidden { display: none !important; }
  .sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); }

  /* ---------- edge light: the voice channel ---------- */
  @property --a { syntax: "<angle>"; inherits: false; initial-value: 0deg; }
  #edge { position: fixed; inset: 0; pointer-events: none; z-index: 40; --lvl: 0; --c: var(--glow);
          box-shadow: inset 0 0 calc(6px + 110px * var(--lvl)) calc(1px + 9px * var(--lvl))
                      color-mix(in srgb, var(--c) calc(14% + 72% * var(--lvl)), transparent); }

  #edge.speaking { --c: var(--speak); }

  #edge::before { content: ""; position: absolute; inset: 0; padding: 2px; opacity: 0; transition: opacity .4s;
                  background: conic-gradient(from var(--a), transparent 0 62%, var(--glow) 80%, transparent 96%);
                  -webkit-mask: linear-gradient(#000 0 0) content-box, linear-gradient(#000 0 0); -webkit-mask-composite: xor; mask-composite: exclude; }
  #edge.thinking::before { opacity: .9; animation: sweep 2.6s linear infinite; }
  @keyframes sweep { to { --a: 360deg; } }

  /* ---------- top: glance line + island ---------- */
  header { position: fixed; top: 0; left: 0; right: 0; z-index: 20; display: flex; align-items: center; gap: 16px; padding: 14px 24px; }
  #glance { flex: 1; text-align: center; color: var(--soft); font-size: 13px; letter-spacing: .01em; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; cursor: pointer; }

  .pill { display: flex; align-items: center; gap: 8px; padding: 7px 14px; border-radius: 999px; cursor: pointer; font-size: 13px;
          background: var(--glass); backdrop-filter: blur(18px) saturate(1.3); -webkit-backdrop-filter: blur(18px) saturate(1.3);
          border: 1px solid color-mix(in srgb, var(--ink) 14%, transparent); max-width: 420px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .pill i { width: 8px; height: 8px; border-radius: 50%; background: var(--res); flex: none; box-shadow: 0 0 10px var(--res); }
  .pill.alarm i { background: var(--err); box-shadow: 0 0 10px var(--err); }

  #stage { position: fixed; top: 92px; bottom: 206px; left: 0; right: 0; padding: 0 24px; }

  /* the ⋯ menu: every other place, only on purpose */
  #more { position: fixed; top: 46px; right: 24px; z-index: 22; font-size: 18px; line-height: 1; padding: 6px 14px; cursor: pointer; border: 1px solid var(--line); background: var(--paper); color: var(--soft); border-radius: 999px; }
  #more .n { font-size: 10px; font-weight: 700; margin-left: 6px; padding: 0 5px; border-radius: 6px; background: var(--res); color: var(--room); vertical-align: middle; } #more .n:empty { display: none; }
  #menu { position: fixed; top: 84px; right: 24px; z-index: 46; min-width: 210px; background: var(--paper); border: 1px solid var(--line); padding: 6px; display: grid; box-shadow: 0 20px 50px -20px rgba(0,0,0,.6); }
  #menu button { text-align: left; border: 0; background: none; padding: 8px 12px; cursor: pointer; font-size: 14px; color: var(--ink); display: flex; gap: 8px; align-items: center; }
  #menu button:hover { background: color-mix(in srgb, var(--glow) 10%, transparent); } #menu button.on { color: var(--glow); }
  #menu .n { margin-left: auto; font-size: 10px; font-weight: 700; padding: 0 5px; border-radius: 6px; background: var(--res); color: var(--room); } #menu .n:empty { display: none; }

  }
  #focus .when { font-size: 12px; font-weight: 700; letter-spacing: .16em; text-transform: uppercase; color: var(--glow); }

    display: flex; gap: 8px; align-items: center; padding: 8px 10px; border-radius: 12px; border: 1px solid var(--line); background: var(--paper, #fff); box-shadow: 0 6px 24px rgba(0,0,0,.18); }

  #talk .foot { font-size: 11px; color: var(--muted); margin-top: 4px; }

  /* library: every deliverable, browsable and searchable; pick several to build a plan on */
  #library { margin: 3vh auto 120px; }
  #library .kick { font-size: 12px; font-weight: 700; letter-spacing: .16em; text-transform: uppercase; color: var(--glow); }
  #library h1 { font: 500 32px/1.15 var(--serif); margin: 10px 0 6px; }

  #library .chips { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 6px; }

  #lib-tray { position: fixed; left: 50%; transform: translateX(-50%); bottom: 214px; width: min(680px, calc(100vw - 32px)); z-index: 30;   /* outside #stage: its mask would clip and fade it */
              background: var(--paper); border: 1px solid var(--glow); border-radius: 14px; padding: 10px 14px; box-shadow: 0 20px 50px -20px rgba(0,0,0,.6); display: grid; gap: 8px; }
  #lib-tray[hidden] { display: none; }

<script>

const md = (s) => DOMPurify.sanitize(marked.parse(s || ""));

// =====================================================================
// Conversation — one live Claude session over the websocket

const talk = $("#talk"), promptEl = $("#prompt");
let ws = null, sessionId = null, turnId = 0, cur = null, curText = "", waiting = false;

function connect(sid) {
  if (ws) { ws.onclose = null; ws.close(); }
  sessionId = sid || null; turnId = 0; cur = null; talk.innerHTML = "";
  ws = new WebSocket(`${location.protocol === "https:" ? "wss" : "ws"}://${location.host}/ws/conversation`);   // https via tailscale serve (phone)
  ws.onopen = () => { $("#conn").textContent = "connected"; ws.send(JSON.stringify({type: "start", session_id: sessionId, voice: true})); };   // audio is the default
  ws.onclose = () => { $("#conn").innerHTML = `<span class="err">offline</span> <a href="#" onclick="connect(sessionId);return false">reconnect</a>`; setWaiting(false); };
  ws.onmessage = (e) => onEvent(JSON.parse(e.data));
  if (sid) loadHistory(sid);
  renderFocus();
}
const wsSend = (o) => ws?.readyState === 1 && ws.send(JSON.stringify(o));
// The conversation outlives the tab: a reload or a new console tab picks up where you were ("New conversation" starts fresh).
const SESSION = "cbrain.session";
const remember = (sid) => { try { sid ? localStorage.setItem(SESSION, sid) : localStorage.removeItem(SESSION); } catch {} };
const remembered = () => { try { return localStorage.getItem(SESSION); } catch { return null; } };
// One live console: a newer console tab takes over; this one steps aside (no second conversation, no second camera),
// and its title tells push-to-talk which tab to bring forward (jarvis.open_console looks for "● ").
const LIVE = new BroadcastChannel("cbrain-console");
let dormant = false;
function goLive() {

}
LIVE.onmessage = (e) => {

  document.title = "○ " + document.title.replace(/^[●○] /, "");

    <button class="btn pri" data-golive>Use this tab instead</button></div></div>`);
};
document.addEventListener("click", (e) => { if (e.target.closest("[data-golive]")) { goLive(); connect(remembered()); } });

function exchange(you) {

  const el = document.createElement("div"); el.className = "x";
  el.innerHTML = `<div class="you">${esc(you)}</div><div class="tools"></div><div class="ans"></div><div class="foot"></div>`;

}
const scrollEnd = () => { const s = $("#jv"); s.scrollTop = s.scrollHeight; };
function setWaiting(on) { waiting = on; cur?.querySelector(".ans").classList.toggle("wait", on && !curText); V.render(); }

function onEvent(ev) {
  if (ev.t === "ready") { if (ev.session_id) { sessionId = ev.session_id; remember(sessionId); } }
  else if (ev.t === "session") { sessionId = ev.session_id; remember(sessionId); }
  else if (ev.t === "turn") {
    turnId = ev.id;
    if (ev.text === null) { V.stop(); return; }                     // interrupt acknowledged
    cur = exchange(ev.text); curText = ""; setWaiting(true);
  }
  else if (ev.t === "text" && !ev.muted && cur) { curText += ev.d; const a = cur.querySelector(".ans"); a.classList.remove("wait"); a.innerHTML = md(curText); scrollEnd(); }
  else if (ev.t === "tool" && !ev.muted && cur) {
    cur.querySelector(".tools").insertAdjacentHTML("beforeend", `<span title="${esc(ev.input)}">${esc(ev.name)} · ${esc(ev.input)}</span>`);
    const m = ev.name === "Write" && String(ev.input).match(/(output\/surfaces\/[\w.-]+\.json)$/);
    if (m) cur.dataset.surface = m[1];
  }
  else if (ev.t === "transcript") { if (!ev.text) V.state("listening"); }
  else if (ev.t === "presence") { setPresence(ev); }
  else if (ev.t === "ptt") { V.native(ev.state); }
  else if (ev.t === "stop_audio") { V.stop(); }
  else if (ev.t === "shielded") { $("#vstate").innerHTML = `<b>${esc(ev.word)}.</b> The answer stays on screen.`; }
  else if (ev.t === "followup") { V.followup(ev.secs, ev.why); }
  else if (ev.t === "enroll") { enrollProgress(ev); }
  else if (ev.t === "audio") { if (ev.turn === turnId) V.play(ev.b64, ev.text); }
  else if (ev.t === "say") { if (ev.turn === turnId) V.said(ev.text, ev.ms); }   // the Mac speaks it (afplay); the page shows it
  else if (ev.t === "stage") { applyStage(ev); }
  else if (ev.t === "jarvis_knock") { J.knock = ev.n ? ev : null; if (!ev.n) J.say = J.heard = ""; renderIsland(); renderJv(); if (ev.n) loadJarvis(); }
  else if (ev.t === "jarvis_open") { closePanel(); }
  else if (ev.t === "jarvis_say") { J.say = ev.text; J.heard = ""; renderJv(); }
  else if (ev.t === "jarvis_heard") { J.heard = ev.text; J.say = ""; renderJv(); }
  else if (ev.t === "result") {
    if (cur) cur.querySelector(".foot").innerHTML = ev.interrupted ? "interrupted" :
      `${(ev.duration_ms / 1000).toFixed(1)}s${ev.denials?.length ? ` · <span class="err">denied: ${esc([...new Set(ev.denials)].join(", "))}</span>` : ""}`;
    if (cur?.dataset.surface) stageTo(`surface:${cur.dataset.surface}`, null, "cos");   // an answer with shape goes on stage
    setWaiting(false); refreshAll();                               // the turn may have enriched the vault or prep
    V.resultIn(turnId);
  }
  else if (ev.t === "error") { const x = exchange("—"); x.querySelector(".ans").innerHTML = `<span class="err">${esc(ev.msg)}</span>`; setWaiting(false); }
}

function say(text, shown) {
  if (!ws || ws.readyState !== 1) return alert("Not connected.");
  V.unlock(); if (waiting || V.speaking()) interrupt();
  wsSend({type: "text", text, shown});
}
function interrupt() { V.cut(); V.stop(); wsSend({type: "interrupt"}); }

promptEl.onkeydown = (e) => {

$("#brief").onclick = () => { V.unlock(); if (waiting || V.speaking()) interrupt(); wsSend({type: "brief"}); };

}

// =====================================================================
// Voice — hands-free mic with local VAD, sentence playback, barge-in,
// and the two things the room renders: an audio level and a karaoke caption.
// =====================================================================
const V = (() => {
  let actx = null, stream = null, proc = null, an = null, on = false, st = "off";
  let noise = 0.01, voiced = 0, silent = 0, capturing = false, chunks = [], preroll = [], micRms = 0;
  let playHead = 0, sources = [], chain = Promise.resolve(), timers = [];
  let native = "off", fu = 0, fuTimer = null, doneTurn = -1, playedTimer = null;
  const FRAME = 2048, buf = new Float32Array(1024);

  function unlock() {
    if (!actx) { actx = new AudioContext(); an = actx.createAnalyser(); an.fftSize = 1024; an.connect(actx.destination); }
    if (actx.state === "suspended") actx.resume();
  }
  function state(s) { st = s; render(); }
  let macUntil = 0, macTimer = null;           // a sentence the Mac is saying right now (server-side playback)
  const speaking = () => sources.length > 0 || Date.now() < macUntil;
  function said(text, ms) {
    macUntil = Date.now() + ms; karaoke(text, 0, ms); render();
    clearTimeout(macTimer); macTimer = setTimeout(() => { if (Date.now() >= macUntil) { $("#caption").classList.remove("on"); render(); } }, ms + 80);
  }
  function mode() {
    if (native === "hearing" || capturing) return "hearing";
    if (speaking()) return "speaking";
    if (fu > 0) return "followup";
    if (native === "thinking" || waiting || st === "transcribing") return "thinking";
    return "off";
  }

  function render() {
    const m = mode();
    document.body.dataset.hudVoice = m;
    $("#mic").classList.toggle("hold", m === "hearing");
    const edge = $("#edge"); edge.classList.toggle("off", m === "off" || m === "followup"); edge.classList.toggle("thinking", m === "thinking");
    edge.classList.toggle("speaking", m === "speaking");
    const key = D.presence?.hotkey ? "Right ⌥" : "🎙";
    const label = {off: `Hold ${key} to talk. Typing works too.`, hearing: "<b>Hearing you…</b> Let go when you're done.",
      thinking: st === "transcribing" && !waiting ? "<b>Transcribing…</b>" : "<b>Thinking…</b>",
      speaking: `<b>Speaking.</b> Hold ${key} or press Space to interrupt.`, followup: `<b>Go on…</b> ${fu}s, only your voice counts.`}[m];
    $("#vstate").innerHTML = label;
    $("#jv-state").textContent = {off: "Jarvis", hearing: "Listening", thinking: "Thinking", speaking: "Speaking", followup: "Go on"}[m];
  }
  // 0..1 for the edge light: live mic while you talk, the actual output signal while it speaks.
  function level() {
    if (Date.now() < macUntil) return .35 + .2 * Math.abs(Math.sin(Date.now() / 110));
    if (speaking() && an) { an.getFloatTimeDomainData(buf); let s = 0; for (const v of buf) s += v * v; return Math.min(1, Math.sqrt(s / buf.length) * 5); }
    if (capturing) return Math.min(1, .2 + micRms * 7);
    if (native === "hearing") return .45;
    return fu > 0 ? .12 : 0;
  }
  function cut() { const e = $("#edge"); e.classList.add("cut"); setTimeout(() => e.classList.remove("cut"), 320); }

  async function start() {
    unlock();
    stream = await navigator.mediaDevices.getUserMedia({audio: {echoCancellation: true, noiseSuppression: true, autoGainControl: true}});
    const src = actx.createMediaStreamSource(stream);
    proc = actx.createScriptProcessor(FRAME, 1, 1);
    proc.onaudioprocess = (e) => frame(new Float32Array(e.inputBuffer.getChannelData(0)));
    const mute = actx.createGain(); mute.gain.value = 0;                 // keep the node running without echoing the mic
    src.connect(proc); proc.connect(mute); mute.connect(actx.destination);
    on = true; render();
  }
  function stopMic() { proc?.disconnect(); stream?.getTracks().forEach((t) => t.stop()); proc = stream = null; on = false; capturing = false; render(); }

  function frame(x) {
    // Meeting shield (calendar for now): in a meeting or 5 min before, release the mic. Never re-arms by itself.
    let sum = 0; for (let i = 0; i < x.length; i++) sum += x[i] * x[i];
    micRms = Math.sqrt(sum / x.length);
    if (capturing && chunks.length * FRAME / actx.sampleRate < 60) chunks.push(x);   // push-to-talk: only while held
  }
  // Browser push-to-talk: the phone, or a Mac with no built-in mic (lid closed). The desktop uses the native mic.
  async function pttStart() {
    unlock(); if (speaking() || waiting) interrupt();
    if (!on) await start();
    capturing = true; chunks = []; render();
  }
  function pttEnd() {
    if (!capturing) return;
    capturing = false; const secs = chunks.length * FRAME / actx.sampleRate;
    if (secs > 0.35) { st = "transcribing"; earcon(); ws?.readyState === 1 && ws.send(wav16k(chunks, actx.sampleRate)); }
    chunks = []; stopMic(); render();
  }

  function wav16k(parts, rate) {
    const len = parts.reduce((a, c) => a + c.length, 0), all = new Float32Array(len);
    let o = 0; for (const c of parts) { all.set(c, o); o += c.length; }
    const ratio = rate / 16000, n = Math.floor(len / ratio), pcm = new Int16Array(n);
    for (let i = 0; i < n; i++) {
      const a = Math.floor(i * ratio), b = Math.min(len, Math.floor((i + 1) * ratio)); let s = 0;
      for (let j = a; j < b; j++) s += all[j];
      pcm[i] = Math.max(-1, Math.min(1, s / Math.max(1, b - a))) * 0x7fff;
    }
    const out = new ArrayBuffer(44 + pcm.length * 2), v = new DataView(out);
    const w = (p, s) => [...s].forEach((c, i) => v.setUint8(p + i, c.charCodeAt(0)));
    w(0, "RIFF"); v.setUint32(4, 36 + pcm.length * 2, true); w(8, "WAVE"); w(12, "fmt ");
    v.setUint32(16, 16, true); v.setUint16(20, 1, true); v.setUint16(22, 1, true); v.setUint32(24, 16000, true);
    v.setUint32(28, 32000, true); v.setUint16(32, 2, true); v.setUint16(34, 16, true); w(36, "data"); v.setUint32(40, pcm.length * 2, true);
    new Int16Array(out, 44).set(pcm); return out;
  }

  // Karaoke: spread the sentence's duration over its words, weighted by length.
  function karaoke(text, delayMs, durMs) {
    const words = text.split(/\s+/).filter(Boolean); if (!words.length) return;
    const weights = words.map((w) => w.length + 2), total = weights.reduce((a, b) => a + b, 0);
    timers.push(setTimeout(() => {
      $("#caption").innerHTML = words.map((w) => `<span>${esc(w)}</span>`).join(" ");
      $("#caption").classList.add("on");
      const spans = [...$("#caption").children]; let t = 0;
      spans.forEach((s, i) => { timers.push(setTimeout(() => s.classList.add("lit"), t)); t += durMs * weights[i] / total; });
    }, Math.max(0, delayMs)));
  }

  function play(b64, text) {
    if (quietNow()) return;   // you said "be quiet": the answer stays on screen until you say "talk again"
    unlock();
    if (actx.state !== "running") $("#vstate").innerHTML = "<b>Click anywhere once</b> so Jarvis can talk. Chrome blocks sound until then.";
    const bytes = Uint8Array.from(atob(b64), (c) => c.charCodeAt(0)).buffer, myTurn = turnId;
    chain = chain.then(async () => {
      if (myTurn !== turnId) return;
      const b = await actx.decodeAudioData(bytes);
      if (myTurn !== turnId) return;
      const s = actx.createBufferSource(); s.buffer = b; s.connect(an);
      playHead = Math.max(actx.currentTime + 0.03, playHead);
      if (text) karaoke(text, (playHead - actx.currentTime) * 1000, b.duration * 1000);
      s.start(playHead); playHead += b.duration;
      sources.push(s); render();
      s.onended = () => { sources = sources.filter((x) => x !== s); if (!sources.length) { setTimeout(() => !sources.length && $("#caption").classList.remove("on"), 500); maybePlayed(); } render(); };
    }).catch(() => {});
  }
  // The reply has been heard in full: tell the server, which may open the 5 s follow-up window.
  function maybePlayed() {
    clearTimeout(playedTimer);
    if (doneTurn !== turnId || speaking()) return;
    playedTimer = setTimeout(() => { if (!speaking() && doneTurn === turnId) wsSend({type: "played", turn: turnId}); }, 1200);
  }
  function resultIn(t) { doneTurn = t; maybePlayed(); }
  function nativeState(s) {
    if (s === "shielded") $("#vstate").innerHTML = `<b>${esc(D.presence?.word || "Shielded")}.</b> The mic stays off.`;
    if (native === "hearing" && s === "thinking") earcon();
    native = s === "shielded" ? "off" : s; if (s === "hearing") { clearTimeout(playedTimer); stop(); } render();
  }
  function followup(secs, why) {
    clearInterval(fuTimer); fu = secs;
    if (secs > 0) fuTimer = setInterval(() => { fu = Math.max(0, fu - 1); if (!fu) clearInterval(fuTimer); render(); }, 1000);
    render();
  }
  // The one earcon (spec v1): an acknowledgement within 300 ms of letting go, on a headset only.
  function earcon() {
    if (D.presence?.room !== "PRIVATE" || !actx) return;
    const t = actx.currentTime, o = actx.createOscillator(), g = actx.createGain();
    o.frequency.setValueAtTime(880, t); o.frequency.setValueAtTime(660, t + .07);
    g.gain.setValueAtTime(0, t); g.gain.linearRampToValueAtTime(.12, t + .01); g.gain.exponentialRampToValueAtTime(.001, t + .16);
    o.connect(g); g.connect(actx.destination); o.start(t); o.stop(t + .17);
  }
  function stop() { macUntil = 0; sources.forEach((s) => { try { s.stop(); } catch {} }); sources = []; playHead = 0; timers.forEach(clearTimeout); timers = []; $("#caption").classList.remove("on"); render(); }

  // Hold to talk. Desktop: the server's native mic (outside the browser, so the meeting shield can see calls).
  const nativeMic = () => D.presence?.capture?.available && ["127.0.0.1", "localhost"].includes(location.hostname);
  let held = false;
  const down = async (e) => { e?.preventDefault(); if (held) return; held = true; unlock();
    if (nativeMic()) { post("/api/ptt", {down: true}); } else { try { await pttStart(); } catch (err) { $("#vstate").textContent = "Microphone unavailable: " + err.message; } } };
  const up = () => { if (!held) return; held = false; nativeMic() ? post("/api/ptt", {down: false}) : pttEnd(); };
  $("#mic").addEventListener("pointerdown", down); ["pointerup", "pointerleave", "pointercancel"].forEach((k) => $("#mic").addEventListener(k, up));
  $("#mic").onclick = (e) => e.preventDefault();
  return {get on() { return on; }, unlock, play, said, stop, speaking, state, render, level, cut, native: nativeState, followup, resultIn, earcon, hold: down, release: up};
})();

// The edge light follows the real signal; static twin under reduced motion (fixed level per state).
(function glow() {
  let lvl = 0;
  const step = () => {
    const target = V.level();
    lvl += (target - lvl) * (target > lvl ? 0.35 : 0.12);
    $("#edge").style.setProperty("--lvl", (reduced ? (target > 0 ? .5 : 0) : lvl).toFixed(3));
    requestAnimationFrame(step);
  };
  requestAnimationFrame(step);
})();

// =====================================================================
// NOW — the focus slot and the day (meeting-prep-loop data)
// =====================================================================
const upcoming = () => (D.meetings?.meetings || []).filter((m) => new Date(m.end) > Date.now());
function untilText(m) {
  const now = Date.now(), s = new Date(m.start);
  if (s <= now) return `Now · until ${hm(m.end)}`;
  const min = Math.round((s - now) / 60000);
  const rel = min < 60 ? `in ${min} min` : min < 720 ? `in ${Math.floor(min / 60)} h ${min % 60} min` : s.toLocaleDateString([], {weekday: "long"});
  return `${rel} · ${hm(m.start)}`;
}
const oneThing = (m) => m.prep?.talking_points?.[0] || m.prep?.goal || (m.status === "failed" ? "Prep failed. Ops has details." : "The Chief of Staff is still preparing this one.");

// The one new thing the team found for this meeting (vault-frontier loop → meeting prep). The client should feel it.
const fresh = (m) => { const n = m?.prep?.new_insight; return n ? `<p class="fresh"><b>New for them:</b> ${esc(n.text)} ${esc(n.so_what)}
  ${/^https:\/\//.test(n.source?.url || "") ? `<a href="${esc(n.source.url)}" target="_blank" rel="noopener">${esc(n.source.title || "source")}</a>` : ""}${n.client_safe ? "" : ` <span class="meta">(internal only)</span>`}</p>` : ""; };
// Meetings that ended in the last 10 hours and had someone external in them: the follow-up is due.
const endedToday = () => (D.meetings?.meetings || []).filter((m) => new Date(m.end) <= Date.now() && Date.now() - new Date(m.end) < 10 * 3600000
  && (m.prep?.participants || []).some((p) => p.internal === false)).reverse();
const earlier = () => endedToday().slice(0, 2).map((m) => `<div class="earlier" data-fu-row="${esc(m.uid)}">Earlier today: <b>${esc(m.title)}</b>
  <button class="btn" data-followup="${esc(m.uid)}">✉ Draft follow-up</button></div>`).join("");
const external = (m) => (m.prep?.participants || []).some((p) => p.internal === false);

// Today: what the day is about when nothing more pressing is on stage. The next meeting, today's reading, your tasks.
function renderFocus() {
  const f = $("#focus"); if (f.classList.contains("hidden")) return;
  if (f.contains(document.activeElement) && document.activeElement.matches("input")) return;   // typing what was agreed
  const next = upcoming()[0];
  let h = !next ? `<div class="when">${esc(D.meetings?.error ? "Calendar sync problem" : "Clear")}</div><h1>No more meetings through ${esc(D.meetings?.window?.[1] || "tomorrow")}.</h1><p class="one">The day is yours.</p>`
    : (() => { const ps = next.prep ? next.prep.participants : next.attendees.map((a) => ({name: a.name || a.email}));
      return `<div class="when">${untilText(next)}</div><h1>${esc(next.title)}</h1>
    <p class="one">${esc(oneThing(next))}</p>${fresh(next)}
    <div class="people">${ps.slice(0, 7).map((p) => `<span><b>${esc(p.name)}</b>${p.internal === false ? `<span class="ext">ext</span>` : ""}</span>`).join("")}${ps.length > 7 ? `<span>+${ps.length - 7}</span>` : ""}</div>
    <div class="acts">${next.link ? `<a class="btn pri" href="${esc(next.link)}" target="_blank" rel="noopener">Join</a>` : ""}
      <button class="btn" data-prep="${esc(next.uid)}">🎙 Prep me</button><button class="btn" data-go="meeting:${esc(next.uid)}">Everything on it</button>
      ${external(next) ? `<button class="btn" data-brief-for="${esc(next.uid)}" title="A one-page leave-behind from public sources, gated for confidentiality">Client brief</button>` : ""}</div>`; })();

function quietNow() {   // quiet only when you said so (the manual shield); nothing goes quiet on its own
  return !!D.presence && !D.presence.speak;

function decisions() {
  const out = [];
  if (J.knock?.n) out.push({jarvis: 1, text: `Jarvis · ${J.knock.n} need${J.knock.n > 1 ? "" : "s"} you · say go`, alarm: false});
  for (const t of D.tasks.filter((x) => x.state === "needs_input")) out.push(t.kind === "plan"
    ? {plan: t.id, text: `${STATUS_STAGE(t) === "interrogate" ? "Questions first" : t.doc && STATUS_STAGE(t) === "plan" ? "Plan to review" : "Checkpoint"}: ${t.title}`, alarm: false}
    : {k: "res", text: `Researcher needs you: ${t.title}`, alarm: false});
  const L = D.loops, failing = (L?.launchd || []).filter((j) => !j.pid && j.last_exit && j.last_exit !== "0");
  if (L?.auth) out.unshift({k: "ops", text: `Claude login expired · ${L.auth.runs} run${L.auth.runs > 1 ? "s" : ""} failed · run claude to log in`, alarm: true});
  if (failing.length) out.push({k: "ops", text: `Ops: ${failing.map((j) => j.label.replace("com.cbrain.", "")).join(", ")} stopped`, alarm: true});
  for (const [m, v] of Object.entries(L?.models?.models || {})) out.push({k: "ops", alarm: v.suite === "failed",
    text: v.suite === "failed" ? `Ops: ${m} failed the regression suite · ${v.jobs.length} job${v.jobs.length > 1 ? "s" : ""} on it`
      : `Ops: testing ${m} on the regression suite · ${v.jobs.length} job${v.jobs.length > 1 ? "s" : ""}`});
  const hot = hotIssues(L?.issues || []), reg = hot.filter((i) => i.state === "regressed");
  if (hot.length) out.push({k: "ops", alarm: !!reg.length, text: reg.length ? `Ops: fix for ${reg.map((i) => i.code).join(", ")} didn't hold`
    : `Ops: ${hot.length} recurring failure${hot.length > 1 ? "s" : ""} · top ${hot[0].code} (${hot[0].runs} runs)`});
  if (D.meetings?.error) out.push({k: "cos", text: "Calendar sync is failing", alarm: true});
  return out;
}

function toast(title, body) {
  if (quietNow()) return;   // the island and the constellation still show it; nothing pops up
  const el = document.createElement("div"); el.className = "toast";
  el.innerHTML = `<b>${esc(title)}</b><div style="margin-top:4px;color:var(--soft)">${esc(body)}</div>`; el.onclick = () => el.remove();
  document.body.appendChild(el); setTimeout(() => el.remove(), 12000);
}

const STANCE_X = {blocker: .04, skeptic: .24, unknown: .5, neutral: .5, supporter: .76, champion: .96};
const SF = {
  Callout: (b) => `<p class="sf-callout ${esc(b.tone || "info")}">${esc(b.text)}</p>`,
  MetricRow: (b) => `<div class="sf-metrics">${b.items.map((i) => `<div><b>${esc(i.value)}</b><span>${esc(i.label)}</span>${i.delta ? `<em>${esc(i.delta)}</em>` : ""}</div>`).join("")}</div>`,
  RiskSheet: (b) => b.items.map((i) => `<div class="sf-risk"><span>${esc(i.label)}</span><i title="${Math.round(i.level * 100)}%"><b style="width:${Math.round(Math.max(0, Math.min(1, i.level)) * 100)}%"></b></i>${i.note ? `<small>${esc(i.note)}</small>` : ""}</div>`).join(""),
  StakeholderMap: (b) => {
    const W = 600, H = 230, used = [];
    const dots = b.people.map((p) => {
      let x = 30 + (STANCE_X[p.stance] ?? .5) * (W - 60), y = H - 28 - Math.max(0, Math.min(1, p.influence)) * (H - 60);
      while (used.some(([ux, uy]) => Math.abs(ux - x) < 70 && Math.abs(uy - y) < 16)) y -= 16;   // keep labels apart
      used.push([x, y]);
      const c = {blocker: "var(--err)", skeptic: "var(--res)", supporter: "var(--ops)", champion: "var(--ops)"}[p.stance] || "var(--muted)";
      return `<g><title>${esc(p.name)}${p.role ? " · " + esc(p.role) : ""} · ${esc(p.stance)}${p.note ? " · " + esc(p.note) : ""}</title>
        <circle cx="${x}" cy="${y}" r="${p.stance === "unknown" ? 5 : 7}" fill="${c}" ${p.stance === "unknown" ? `fill-opacity=".35"` : ""}/>
        <text x="${x + 10}" y="${y + 4}">${esc(p.name)}</text></g>`;
    }).join("");
    return `<div class="sf-map"><svg viewBox="0 0 ${W} ${H}"><line x1="30" y1="${H - 20}" x2="${W - 30}" y2="${H - 20}" stroke="var(--line)"/>
      <line x1="${W / 2}" y1="10" x2="${W / 2}" y2="${H - 20}" stroke="var(--line)" stroke-dasharray="3 4"/>
      <text x="30" y="${H - 4}">against</text><text x="${W - 60}" y="${H - 4}">for</text><text x="${W / 2 + 6}" y="20">influence ↑</text>${dots}</svg></div>`;
  },
  Timeline: (b) => { const today = todayISO(); const ev = [...b.events].sort((a, c) => a.date.localeCompare(c.date));
    return `<div class="sf-tl">${ev.map((e) => `<div class="${esc(e.kind || "past")} ${e.date === today ? "today" : ""}"><small>${esc(e.date)}${e.date === today ? " · today" : ""}</small>${esc(e.label)}</div>`).join("")}</div>`; },
  DecisionCard: (b) => `<div class="sf-dec"><div class="q">${esc(b.question)}</div>${b.options.map((o) =>
    `<div class="opt ${b.recommendation && b.recommendation === o.label ? "rec" : ""}"><b>${esc(o.label)}</b>${o.for ? `<small>For: ${esc(o.for)}</small>` : ""}${o.against ? `<small>Against: ${esc(o.against)}</small>` : ""}</div>`).join("")}
    ${b.recommendation && !b.options.some((o) => o.label === b.recommendation) ? `<p class="meta">Recommendation: ${esc(b.recommendation)}</p>` : ""}</div>`,
  PersonCard: (b) => `<div class="sf-person"><b>${esc(b.name)}</b><div class="meta">${esc([b.role, b.company].filter(Boolean).join(" · "))}</div>
    ${b.note ? `<p style="margin:6px 0 0">${esc(b.note)}</p>` : ""}${b.ask ? `<div class="ask">Ask: ${esc(b.ask)}</div>` : ""}</div>`,
  DocList: (b) => `<ul class="tight">${b.docs.map((d) => `<li>${d.link && /^https:\/\//.test(d.link) ? `<a href="${esc(d.link)}" target="_blank" rel="noopener">${esc(d.name)}</a>` : esc(d.name)}
    <span class="meta">${esc([d.by, d.when].filter(Boolean).join(" · "))}</span>${d.insight ? `<br>${esc(d.insight)}` : ""}</li>`).join("")}</ul>`,
};
function renderSurface(sf) {
  if (!sf?.blocks?.length) return "";
  const blocks = sf.blocks.filter((b) => SF[b.type]).map((b) => `<section class="sf sf-${esc(b.confidence)}">${b.title ? `<h5>${esc(b.title)}</h5>` : ""}${SF[b.type](b)}
    <div class="sf-src">${b.confidence === "unsure" ? "" : esc(b.confidence) + (b.sources?.length ? " · " : "")}${(b.sources || []).map(esc).join(" · ")}</div></section>`).join("");
  return `<div class="surface">${blocks}${sf.basis?.length ? `<div class="sf-basis">Built from: ${sf.basis.map((x) => `<span title="${esc(x.ref)}">${esc(x.label)}</span>`).join("")}</div>` : ""}</div>`;
}

// ---- the canvas: meetings across time, their people around them, documents beneath, plans aside.
let sitOpen = false, mailOpen = false, drag = null;
const openSituation = () => stageTo("view:situation");

function renderCanvas() {
  if (!sitOpen || drag) return;
  const el = $("#canvas"), W = el.clientWidth || 1000, H = Math.max(520, $("#stage").clientHeight - 20);
  el.style.height = H + "px";
  const ms = upcoming().slice(0, 6), nodes = [], links = [], seen = {};
  ms.forEach((m, i) => {
    const x = W * (ms.length === 1 ? .5 : .12 + .76 * i / (ms.length - 1)), y = H * .46;
    nodes.push({id: "m" + i, kind: "mtg", label: m.title, sub: `${new Date(m.start).toDateString() === new Date().toDateString() ? "" : new Date(m.start).toLocaleDateString([], {weekday: "short"}) + " "}${hm(m.start)}`, x, y, ref: m.uid});
    const ps = (m.prep ? m.prep.participants : m.attendees.map((a) => ({name: a.name || a.email}))).slice(0, 6);
    ps.forEach((p, j) => {
      const key = p.name.toLowerCase();
      if (!seen[key]) {
        const ang = -Math.PI / 2 + (j - (ps.length - 1) / 2) * .55;
        seen[key] = {id: "p" + nodes.length, kind: "person" + (p.internal === false ? " ext" : ""), label: p.name, x: x + Math.cos(ang) * 150, y: y + Math.sin(ang) * 120 - 20, ref: p.name};
        nodes.push(seen[key]);
      }
      links.push(["m" + i, seen[key].id]);
    });
    (m.prep?.documents?.length ? m.prep.documents : m.docs || []).slice(0, 3).forEach((d, j) => {
      const id = "d" + nodes.length; nodes.push({id, kind: "doc", label: d.name, x: x + (j - 1) * 120, y: y + 130 + (j % 2) * 34, ref: d.name, link: d.link});
      links.push(["m" + i, id]);
    });
  });
  D.tasks.filter((t) => t.kind === "plan" && !["cancelled", "done"].includes(t.state)).slice(0, 3).forEach((t, k) => {
    nodes.push({id: "pl" + k, kind: "plan", label: "Plan · " + t.title, x: W * .5 + (k - 1) * 300, y: H * .78, ref: t.id});
  });
  // Layout pass: estimate each node's box, push overlaps apart, keep everything inside the canvas.
  const box = (n) => ({w: Math.min(n.kind === "mtg" ? 230 : 210, n.label.length * (n.kind === "mtg" ? 8 : 7) + 26), h: n.kind === "mtg" ? 58 : 30});
  for (let it = 0; it < 60; it++) {
    let moved = false;
    for (let a = 0; a < nodes.length; a++) for (let b = a + 1; b < nodes.length; b++) {
      const A = nodes[a], B = nodes[b], ba = box(A), bb = box(B);
      const ox = (ba.w + bb.w) / 2 + 10 - Math.abs(A.x - B.x), oy = (ba.h + bb.h) / 2 + 6 - Math.abs(A.y - B.y);
      if (ox > 0 && oy > 0) {
        moved = true;
        const mA = A.kind === "mtg" ? 0 : B.kind === "mtg" ? 1 : .5;   // meetings hold their place in time
        if (ox < oy * 2) { const d = (A.x < B.x ? -1 : 1) * ox; A.x += d * mA; B.x -= d * (1 - mA); }
        else { const d = (A.y < B.y ? -1 : 1) * oy; A.y += d * mA; B.y -= d * (1 - mA); }
      }
    }
    for (const n of nodes) { const b = box(n); n.x = Math.max(b.w / 2 + 8, Math.min(W - b.w / 2 - 8, n.x)); n.y = Math.max(40 + b.h / 2, Math.min(H * .84, n.y)); }
    if (!moved) break;
  }
  const pos = Object.fromEntries(nodes.map((n) => [n.id, n]));
  el.innerHTML = `<div class="hint">Drag anything onto anything: a person onto a meeting asks what to raise, a document onto a meeting asks what matters, anything onto the Researcher starts research. Click a meeting to open it.</div>
    <svg class="links">${links.map(([a, b]) => `<line data-a="${a}" data-b="${b}" x1="${pos[a].x}" y1="${pos[a].y}" x2="${pos[b].x}" y2="${pos[b].y}"/>`).join("")}</svg>`
    + nodes.map((n) => `<div class="node ${n.kind}" data-node="${n.id}" data-kind="${n.kind.split(" ")[0]}" data-ref="${esc(n.ref)}" ${n.link ? `data-link="${esc(n.link)}"` : ""}
        style="left:${n.x}px;top:${n.y}px" title="${esc(n.label)}">${esc(n.label)}${n.sub ? `<small>${esc(n.sub)}</small>` : ""}</div>`).join("");
  if (!ms.length) el.insertAdjacentHTML("beforeend", `<p class="meta" style="position:absolute;top:45%;width:100%;text-align:center">Nothing scheduled. The canvas fills as the Chief of Staff syncs your calendar.</p>`);
}

function dropCommand(src, dst) {
  const name = (n) => n.dataset.ref, kind = (n) => n.dataset.kind, title = (n) => n.textContent.trim();
  const mtg = (n) => upcoming().find((m) => m.uid === n.dataset.ref);
  if (dst.dataset.star === "res") return say(`Have the team research ${kind(src) === "mtg" ? `what I need to know for the meeting "${mtg(src)?.title}"` : kind(src) === "person" ? `${name(src)}: role, recent public activity, and how they connect to my accounts` : `the document "${name(src)}" and what it means for my pursuits`}. Standard depth.`, `Research: ${title(src)}`);
  if (dst.dataset.star) return;
  if (kind(dst) === "mtg") {
    const m = mtg(dst);
    if (kind(src) === "person") return say(`What should I raise with ${name(src)} in "${m.title}" at ${hm(m.start)}? Two or three points.`, `${name(src)} → ${m.title}`);
    if (kind(src) === "doc") return say(`Brief me on what in "${name(src)}" matters for "${m.title}" at ${hm(m.start)}.`, `${name(src)} → ${m.title}`);
    if (kind(src) === "mtg") return say(`How do "${mtg(src).title}" and "${m.title}" connect? Anything I should carry from one into the other?`, `${mtg(src).title} ↔ ${m.title}`);
  }
  if (kind(dst) === "person" && kind(src) === "person") return say(`How are ${name(src)} and ${name(dst)} connected, and is there a reason to introduce them?`, `${name(src)} ↔ ${name(dst)}`);
  if (kind(dst) === "plan") return say(`For the living plan "${title(dst)}" (output/tasks/${name(dst)}/): take ${title(src)} into account. If the plan is paused, write that as my answer.`, `${title(src)} → ${title(dst)}`);
  if (kind(dst) === "doc" && kind(src) === "person") return say(`What does ${name(src)} need to know from "${name(dst)}"?`, `${name(src)} → ${name(dst)}`);
}

$("#canvas").addEventListener("pointerdown", (e) => {
  const n = e.target.closest(".node"); if (!n) return;
  drag = {n, x0: e.clientX, y0: e.clientY, left: parseFloat(n.style.left), top: parseFloat(n.style.top), moved: false};
  n.setPointerCapture(e.pointerId); n.classList.add("dragging");
});
$("#canvas").addEventListener("pointermove", (e) => {
  if (!drag) return;
  const dx = e.clientX - drag.x0, dy = e.clientY - drag.y0; if (Math.abs(dx) + Math.abs(dy) > 4) drag.moved = true;
  drag.n.style.left = drag.left + dx + "px"; drag.n.style.top = drag.top + dy + "px";
  document.querySelectorAll(".target").forEach((t) => t.classList.remove("target"));
  const hit = document.elementsFromPoint(e.clientX, e.clientY).find((x) => (x.matches(".node") && x !== drag.n) || x.matches(".star"));
  hit?.classList.add("target");
});
$("#canvas").addEventListener("pointerup", (e) => {
  if (!drag) return;
  const d = drag; drag = null; d.n.classList.remove("dragging");
  const hit = document.querySelector(".target"); document.querySelectorAll(".target").forEach((t) => t.classList.remove("target"));
  if (!d.moved) {                       // a click, not a drag
    if (d.n.dataset.kind === "mtg") return openMeeting(d.n.dataset.ref);
    if (d.n.dataset.kind === "plan") return openPlan(d.n.dataset.ref);
    if (d.n.dataset.link) return window.open(d.n.dataset.link, "_blank", "noopener");
    return renderCanvas();
  }
  if (hit) { V.unlock(); dropCommand(d.n, hit); return renderCanvas(); }   // the answer arrives in the conversation, on the left
  renderCanvas();                       // dropped on nothing: everything returns to its place
});
addEventListener("resize", () => sitOpen && renderCanvas());

const OWNERS = ["cos", "analyst", "researcher", "you"], OWNER_LABEL = {cos: "Chief of Staff", analyst: "Analyst", researcher: "Researcher", you: "You"};
const STATUS_STAGE = (t) => t.stage || "";
let plansOpen = false;

const mode = () => sitOpen ? "situation" : mailOpen ? "mail" : libOpen ? "library" : ideasOpen ? "ideas" : (plansOpen || openPlanId) ? "plans" : itemOpen ? "item" : "today";
function setMode(m, planId) {

  sitOpen = m === "situation"; mailOpen = m === "mail"; libOpen = m === "library"; ideasOpen = m === "ideas"; itemOpen = m === "item";
  openPlanId = m === "plans" ? planId || null : null; plansOpen = m === "plans" && !openPlanId; planBuf = null;

  syncModes(); $("#work").scrollTop = 0; renderHead(); renderJv();

function syncModes() {

    ideas: (typeof IDEAS !== "undefined" && IDEAS.all.filter((i) => i.status === "new").length) || 0,

// The stage (server.py STAGE). Jarvis fills it by urgency and importance; you (a click) or the Chief of
// Staff (by voice) move it. Moving it off her pick tells her she was wrong, and she learns.
function show(ref) {
  const i = ref.indexOf(":"), k = i < 0 ? ref : ref.slice(0, i), v = i < 0 ? "" : ref.slice(i + 1);
  if (k === "view") return setMode(v);
  if (k === "today") return setMode("today");
  if (k === "task") {
    const t = D.tasks.find((x) => x.id === v);
    if (!t) return void loadTasks().then(() => ST.ref === ref && show(ref));   // a plan the Chief of Staff just wrote
    return t.kind === "plan" ? setMode("plans", v) : setMode("item");
  }
  setMode("item");
}
function applyStage(st) {
  const busy = $("#work").contains(document.activeElement) && document.activeElement.matches?.("textarea, input, [contenteditable=true]");
  if (st.by === "jarvis" && busy) return;                  // her pick never yanks what you're typing
  const prev = ST.ref; ST = {ref: st.ref, why: st.why || "", by: st.by, item: st.item || null};
  if (st.ref !== prev) show(st.ref); else { renderHead(); renderJv(); syncModes(); if (itemOpen) renderItem(); }
}
function stageTo(ref, item, by) {
  applyStage({ref, why: "", by: by || "you", item: item || null});
  post("/api/stage", {ref, item: item || null, by: by || "you"});
}
const BY = {jarvis: "Jarvis's pick", cos: "Chief of Staff", you: "Your pick"};
function renderHead() {

// One item on stage: a meeting, a mail, an idea, the briefing, a research task, or an answer's surface.
const SURF = new Map();
const gone = (msg) => `<p class="meta">${esc(msg)}</p><button class="btn" data-go="today">Back to today</button>`;
async function renderItem(force) {
  const el = $("#item"); if (!itemOpen) return;
  if (!force && el.contains(document.activeElement) && document.activeElement.matches("textarea, input")) return;   // never wipe what you're typing
  const ref = ST.ref, i = ref.indexOf(":"), k = ref.slice(0, i < 0 ? ref.length : i), v = i < 0 ? "" : ref.slice(i + 1);
  const qi = J.queue.find((x) => x.id === ST.item || x.ref === ref);
  let h;
  if (k === "meeting") {
    const m = (D.meetings?.meetings || []).find((x) => x.uid === v);
    h = !m ? gone("That meeting isn't on the calendar any more.") : `<div class="kick">${esc(untilText(m))}</div><h1>${esc(m.title)}</h1>${meetingBody(m)}`
      + (endedToday().some((x) => x.uid === m.uid) ? `<div class="earlier" data-fu-row="${esc(m.uid)}">It's over. <button class="btn" data-followup="${esc(m.uid)}">✉ Draft follow-up</button></div>` : "");
  } else if (k === "mail") {
    const cs = D.mail?.companies || [], kind = cs.some((c) => c.answer.some((x) => x.id === v)) ? "answer" : cs.some((c) => c.action.some((x) => x.id === v)) ? "action" : "know";
    const x = cs.flatMap((c) => [...c.answer, ...c.action, ...c.know]).find((y) => y.id === v);
    h = !x ? gone(D.mail ? "That mail is dealt with." : "Loading mail…") : `<div class="kick">Mail · ${esc(kind === "answer" ? "answer needed" : kind === "action" ? "action needed" : "to know")}</div><h1>${esc(x.subject || "(no subject)")}</h1>${mailItem(x, kind)}`;
  } else if (k === "idea") {
    const it = ideaById(v); h = it ? `<div class="kick">Idea</div>${ideaCard(it)}` : gone("That idea is gone.");
  } else if (k === "briefing") {
    h = D.brief ? `<div class="kick">The Analyst's briefing</div>${renderBriefing(D.brief)}` : gone("No briefing yet.");
  } else if (k === "task") {
    const t = D.tasks.find((x) => x.id === v); h = t ? `<div class="kick">Researcher</div><h1>${esc(t.title)}</h1>${taskCard(t)}` : gone("That task is gone.");
  } else if (k === "surface") {
    if (!SURF.has(v)) SURF.set(v, await fetch(`/api/surface?path=${encodeURIComponent(v)}`).then((r) => r.ok ? r.json() : null).catch(() => null));
    if (ST.ref !== ref) return;
    h = SURF.get(v) ? `<div class="kick">From the conversation</div>${renderSurface(SURF.get(v))}` : gone("That answer's surface is gone.");
  } else if (k === "topic") {
    const t = await fetch(`/api/topic?name=${encodeURIComponent(v)}`).then((r) => r.ok ? r.json() : null).catch(() => null);
    if (ST.ref !== ref) return;
    const known = new Set(t?.topics || []);   // a [[link]] to another topic goes on stage; the rest stay plain
    const wl = (s) => s.replace(/\[\[([^\]|#]+)(?:#[^\]|]*)?(?:\|([^\]]+))?\]\]/g, (_, n, a) => known.has(n.trim()) ? `<a href="#" data-go="topic:${esc(n.trim())}">${esc(a || n)}</a>` : `<b>${esc(a || n)}</b>`);
    h = !t ? gone("That topic isn't in the vault.") : `<div class="kick">Topic<a data-ask="About the vault topic cbrain/projects/${esc(t.name)}.md: ">Ask about it</a></div><div class="libdoc">${md(wl(t.markdown))}</div>`
      + (t.docs.length ? `<div class="h">Deliverables</div>` + t.docs.map((d) => `<div class="later"><span class="t">${esc(d.date)}</span><a href="#" data-go="doc:${esc(d.id)}"><b>${esc(d.title)}</b></a></div>`).join("") : "")
      + (t.linked.length ? `<p class="meta">Linked from: ${t.linked.map((x) => x.folder === "projects" ? `<a href="#" data-go="topic:${esc(x.name)}">${esc(x.name)}</a>` : esc(x.name)).join(" · ")}</p>` : "");
  } else if (k === "doc") {
    const r = await fetch(`/api/library/item/${encodeURIComponent(v)}`).catch(() => null), it = r?.ok ? await r.json() : null;
    if (ST.ref !== ref) return;
    h = !it ? gone("That deliverable is gone.") : `<div class="kick">${esc(it.type)} · ${esc(it.date)}<a data-ask="About ${esc(it.path)} (&quot;${esc(it.title)}&quot;): ">Ask about it</a></div><h1>${esc(it.title)}</h1>${libBody(it, v)}`;

let openPlanId = null, planBuf = null;        // planBuf: your unsent edits (steps), kept across polls

function activeOwner() {
  for (const t of D.tasks) if (t.kind === "plan" && t.state === "working") {
    const a = (t.doc?.steps || []).find((s) => s.status === "active"); if (a) return a.owner;
  }
  return null;
}
const openPlan = (id) => stageTo(`task:${id}`), closePlan = () => stageTo("view:plans");

function renderPlan(force) {
  const el = $("#plan"), t = D.tasks.find((x) => x.id === openPlanId);
  if (!openPlanId) return;
  if (!t) { el.innerHTML = `<div class="kick">Living plan</div><p class="meta">The team is picking it up…</p>`; return; }
  if (!force && (planBuf?.dirty || el.contains(document.activeElement) || [...el.querySelectorAll(".iq textarea")].some((x) => x.value))) return;   // never wipe your unsent edits
  const p = t.doc;
  if (!p) { el.innerHTML = `<div class="kick">Living plan · ${t.state === "needs_input" && STATUS_STAGE(t) === "interrogate" ? "questions first" : "reading your vault"}<a data-plan-close>all plans</a></div><h1>${esc(t.title)}</h1>${t.state === "needs_input" && STATUS_STAGE(t) === "interrogate" ? interrogation(t)
    : `<p class="meta">${t.state === "failed" || t.state === "lost" ? esc(t.error || "Stopped without reporting. Ops has the log.") : "The team is reading your vault and preparing its questions. No research starts until you've answered them."}</p>`}`; return; }
  const paused = t.state === "needs_input", stage = STATUS_STAGE(t);
  if (paused && stage === "interrogate") { el.innerHTML = `<div class="kick">Living plan · questions first<a data-plan-close>all plans</a></div><h1>${esc(t.title)}</h1>${interrogation(t)}`; el.dataset.task = t.id; return; }
  const steps = planBuf?.steps || p.steps.map((s) => ({...s}));
  const editable = (s) => paused && ["pending", "waiting"].includes(s.status);
  const stateLabel = {needs_input: stage === "plan" ? "your edit" : "checkpoint", working: "working", resuming: "resuming", done: "done", failed: "failed", lost: "stopped", queued: "queued"}[t.state] || t.state;
  let h = `<div class="kick">Living plan · ${esc(stateLabel)}${p.updated ? ` · updated ${ago(p.updated)}` : ""}<a data-plan-close>all plans</a></div>
    <h1>${esc(t.title)}</h1><p class="outcome">${esc(p.outcome)}</p>
    ${(p.interrogation || []).length ? `<details class="qa"><summary>What you told the team (${p.interrogation.length})</summary>${p.interrogation.map((x) => `<p><b>${esc(x.q)}</b><br>${esc(x.a || "skipped: planned as an assumption")}</p>`).join("")}</details>` : ""}
    <div class="ff"><b>Deliverable:</b> ${esc(p.deliverable?.shape || "")} · ~${esc(p.estimate?.minutes ?? "?")} min
      <details><summary>${(p.sources_planned || []).length} planned sources</summary>${(p.sources_planned || []).map((x) => `<span class="src">${esc(x)}</span>`).join("")}</details></div><ol class="steps">`;
  for (const s of steps) {
    const ed = editable(s), waitingHere = paused && stage === s.id;
    h += `<li class="step ${esc(s.status)}" data-sid="${esc(s.id || "")}">
      <button class="owner o-${esc(s.owner)} ${ed ? "edit" : ""}" ${ed ? `data-owner title="Click to reassign"` : "disabled"}>${esc(OWNER_LABEL[s.owner] || s.owner)}</button>
      <div><div class="ttl" contenteditable="${ed}" spellcheck="false">${esc(s.title)}</div>
        ${s.note ? `<div class="note">${esc(s.note)}</div>` : ""}
        ${(s.findings || []).map((f) => `<p class="f ${esc(f.confidence)}" title="${esc(f.confidence)} · ${esc((f.sources || []).join(" · "))}">${esc(f.text)}<sup>${f.confidence === "unsure" ? "unsure" : (f.sources || []).length + " src"}</sup></p>`).join("")}</div>
      <div class="tools">${ed ? `<button class="cp ${s.checkpoint ? "on" : ""}" data-cp title="Checkpoint before this step">◆</button><button data-up title="Move up">↑</button><button data-rm title="Remove step">×</button>`
        : s.checkpoint ? `<span class="meta" title="${esc(s.checkpoint.stakes)}">◆</span>` : ""}</div>
      ${waitingHere ? checkpointCard(t, s) : ""}</li>`;
  }
  h += `</ol>`;
  if (paused) h += `<div class="row" style="margin-top:10px"><button class="btn" data-add>+ Add a step</button><span class="meta">Edit titles in place, click an owner to reassign, ↑ reorders, ◆ toggles a checkpoint.</span></div>`;
  if (paused && (stage === "plan" || !steps.some((s) => s.id === stage))) h += `<div class="planbar"><div class="q">${esc(t.question || "Go with this plan?")}</div>
      <div class="row">${(t.options || ["Go"]).map((o) => `<button class="btn ${/^go/i.test(o) ? "pri" : ""}" data-plan-answer="${esc(o)}">${esc(o)}</button>`).join("")}</div>
      <input placeholder="Or say what to change, then Enter…" data-plan-text></div>`;
  if (t.state === "done") h += `<div class="planbar"><div class="q">${esc(t.summary || "Done.")}</div><div class="row">
      <button class="btn pri" data-task-act="report" data-task-id="${esc(t.id)}">Open the deliverable</button><button class="btn" data-plan-tell>🎙 Tell me</button></div></div>`;
  if (["failed", "lost"].includes(t.state)) h += `<p class="err">${esc(t.error || "Stopped without reporting. Ops has the log.")}</p>`;
  const rc = p.receipts || [];

  el.innerHTML = h; el.dataset.task = t.id;
}
// Questions before any research. Answer what you can; a blank stays blank (the team plans it as an assumption).
function interrogation(t) {
  const qs = t.questions || [];
  return `<p class="outcome">${esc(t.question || "Before we plan: answer what you can.")}</p>
    ${qs.map((x, i) => `<div class="iq" data-qid="${esc(x.id || "q" + (i + 1))}"><div class="q">${esc(x.q)}</div>${x.why ? `<div class="why">Why it matters: ${esc(x.why)}</div>` : ""}<textarea rows="2" placeholder="Your answer…"></textarea></div>`).join("")}
    <div class="row"><button class="btn pri" data-iq-send>Answer and plan</button><button class="btn" data-iq-skip>Skip the questions</button>
      <span class="meta">Blanks are fine. The team will name them as assumptions.</span></div>`;
}
async function sendInterrogation(skip) {
  const t = D.tasks.find((x) => x.id === openPlanId), qs = t?.questions || [];
  const text = skip ? "Skip the questions. Plan with what you have and name every gap as an assumption in step 1."
    : [...$("#plan").querySelectorAll(".iq")].map((el, i) => `${el.dataset.qid}: ${qs[i]?.q}\nA: ${el.querySelector("textarea").value.trim() || "(no answer)"}`).join("\n\n");
  const r = await post(`/api/tasks/${openPlanId}/answer`, {text}); if (!r.ok) return alert((await r.json()).detail);
  await loadTasks(); renderPlan(true);
}

function checkpointCard(t, s) {
  return `<div class="ckpt">${s.checkpoint?.stakes ? `<div class="stakes"><b>Stakes:</b> ${esc(s.checkpoint.stakes)}</div>` : ""}
    <div class="q">${esc(t.question || s.checkpoint?.question || "Go?")}</div>
    <div class="row">${(t.options || s.checkpoint?.options || ["Go"]).map((o) => `<button class="btn" data-plan-answer="${esc(o)}">${esc(o)}</button>`).join("")}</div>
    <input placeholder="Or answer in your own words, then Enter…" data-plan-text></div>`;
}

// Read your in-place edits back out of the document into the buffer.
function captureEdits() {
  const t = D.tasks.find((x) => x.id === openPlanId); if (!t?.doc) return null;
  const base = planBuf?.steps || t.doc.steps.map((s) => ({...s}));
  const byId = Object.fromEntries(base.map((s, i) => [s.id || `new${i}`, s]));
  const out = [...$("#plan").querySelectorAll(".step")].map((li, i) => {
    const s = {...(byId[li.dataset.sid || `new${i}`] || {})};
    s.title = li.querySelector(".ttl").innerText.trim() || s.title;
    return s;
  });
  planBuf = {steps: out, dirty: planBuf?.dirty || out.some((s, i) => s.title !== base[i]?.title)};
  return planBuf;
}
async function sendPlan(answer) {
  const buf = captureEdits(), id = openPlanId;
  const r = await post(`/api/tasks/${id}/plan`, {steps: buf.steps.map((s) => ({id: s.id, title: s.title, owner: s.owner, checkpoint: !!s.checkpoint})), answer});
  if (!r.ok) return alert((await r.json()).detail);
  planBuf = null; await loadTasks(); renderPlan(true);
}

$("#plan").addEventListener("click", async (e) => {
  const q = (sel) => e.target.closest(sel), li = q(".step");
  if (q("[data-plan-close]")) return closePlan();
  if (q("[data-iq-send]")) return sendInterrogation(false);
  if (q("[data-iq-skip]")) return sendInterrogation(true);
  if (q("[data-owner]")) { captureEdits(); const s = planBuf.steps.find((x) => (x.id || "") === li.dataset.sid);
    s.owner = OWNERS[(OWNERS.indexOf(s.owner) + 1) % OWNERS.length]; planBuf.dirty = true; return renderPlan(true); }
  if (q("[data-cp]")) { captureEdits(); const s = planBuf.steps.find((x) => (x.id || "") === li.dataset.sid);
    s.checkpoint = s.checkpoint ? null : {stakes: "Added by you.", question: "Ready?"}; planBuf.dirty = true; return renderPlan(true); }
  if (q("[data-up]")) { captureEdits(); const st = planBuf.steps, i = st.findIndex((x) => (x.id || "") === li.dataset.sid);
    if (i > 0 && ["pending", "waiting"].includes(st[i - 1].status)) { [st[i - 1], st[i]] = [st[i], st[i - 1]]; planBuf.dirty = true; }
    return renderPlan(true); }
  if (q("[data-rm]")) { captureEdits(); planBuf.steps = planBuf.steps.filter((x) => (x.id || "") !== li.dataset.sid || x.status !== "pending"); planBuf.dirty = true; return renderPlan(true); }
  if (q("[data-add]")) { captureEdits(); planBuf.steps.push({id: "", title: "New step: describe it", owner: "you", status: "pending", checkpoint: null}); planBuf.dirty = true; return renderPlan(true); }
  if (q("[data-plan-answer]")) {
    const a = q("[data-plan-answer]").dataset.planAnswer;
    if (/talk it through/i.test(a)) { const t = D.tasks.find((x) => x.id === openPlanId);
      promptEl.value = `About the plan "${t.title}" (output/tasks/${t.id}/PLAN.json): `; return promptEl.focus(); }
    return sendPlan(a);
  }
  if (q("[data-flag]")) { const b = q("[data-flag]"); await post(`/api/tasks/${openPlanId}/flag`, {ref: b.dataset.flag, reason: b.dataset.reason}); await loadTasks(); return renderPlan(true); }
  if (q("[data-plan-tell]")) { const t = D.tasks.find((x) => x.id === openPlanId);
    return say(`The team finished the plan "${t.title}". Read the deliverable at ${t.report} and give me the result in under 45 seconds spoken: the answer, what it means, and the biggest caveat.`, `Tell me: ${t.title}`); }
});

function planState(t) {

}

// JARVIS PRESENCE — the meeting shield, always visible; content-free frame in meetings (spec v1 §1, §7)
// =====================================================================
let revealUntil = 0;
function setPresence(p) {
  const was = D.presence; D.presence = p;
  const shield = p.blank || p.state === "IN-MEETING", quiet = !p.speak && !shield;
  const mic = V.native === undefined ? "" : (p.capture?.recording ? "MIC ON" : p.listen ? (p.hotkey ? "HOLD ⌥" : "HOLD 🎙") : "MIC OFF");
  $("#pres").className = shield ? "shield" : quiet || p.state === "QUIET" ? "quiet" : "";
  $("#pres").innerHTML = `${esc(p.word)} <i>· ${esc(mic)} · ${esc(p.room)}</i>`;
  const ov = $("#shieldov"), show = p.blank && Date.now() > revealUntil;
  if (show) ov.innerHTML = `<div><div class="g">◈</div><div class="w">${esc(p.word)}</div>
      <div class="tm">${new Date().toLocaleTimeString([], {hour: "2-digit", minute: "2-digit"})}</div>
      <p class="meta">Nothing shows while a meeting might be on a shared screen. Voice is off.</p>
      <button class="btn" data-reveal>Show anyway · I'm not sharing · 5 min</button></div>`;
  ov.hidden = !show;
  if (was && was.blank && !p.blank) refreshAll();
  if (p.blank) closePanel();
  document.body.dataset.hudShield = p.blank || p.state === "IN-MEETING" ? "1" : "";
  V.render();
}
$("#shieldov").addEventListener("click", (e) => { if (e.target.closest("[data-reveal]")) { revealUntil = Date.now() + 5 * 60000; $("#shieldov").hidden = true; setTimeout(() => D.presence && setPresence(D.presence), 5 * 60000 + 500); } });
async function loadPresence() { try { setPresence(await (await fetch("/api/presence")).json()); } catch {} }
const fmtAge = (s) => s == null ? "never" : s < 120 ? `${Math.round(s)} s` : `${Math.round(s / 60)} min`;
function openPresence() {
  const p = D.presence; if (!p) return;
  const c = p.capture || {};

  if (q("[data-lib-pick]")) { const id = q("[data-lib-pick]").dataset.libPick; LIB.sel.has(id) ? LIB.sel.delete(id) : LIB.sel.set(id, libById(id)); renderLibrary(); return openLib(id); }
  if (q("[data-lib-app]")) { await post(`/api/library/open/${encodeURIComponent(q("[data-lib-app]").dataset.libApp)}`); return toast("Library", "Opened on your Mac."); }
  if (q("[data-lib-askabout]")) { const it = libById(q("[data-lib-askabout]").dataset.libAskabout); closePanel();
    promptEl.value = `About ${it.path} ("${it.title}"): `; return promptEl.focus(); }
});

// =====================================================================
// MAIL — by company → to know / action needed / answer needed (workflow-ops/mail-triage).
// A reply leaves only on Approve & send; your edits to a draft survive every refresh.
// =====================================================================
const mailDraft = {};          // id → {body, all}: your unsent edits
const gmailLink = (t) => `https://mail.google.com/mail/u/0/#all/${encodeURIComponent(t)}`;
async function loadMail(force) {
  try { D.mail = await (await fetch("/api/mail")).json(); } catch { return; }
  syncModes(); renderMail(force); if (itemOpen && ST.ref.startsWith("mail:")) renderItem(force);
}
function mailItem(x, kind) {
  const head = `<div class="mh"><b>${esc(x.from)}</b><a href="${gmailLink(x.thread_id)}" target="_blank" rel="noopener" title="Open in Gmail">${esc(x.subject || "(no subject)")}</a><span class="t">${esc(Date.now() - x.ms < 172800000 ? ago(new Date(x.ms).toISOString()) : new Date(x.ms).toLocaleDateString([], {day: "numeric", month: "short"}))}</span></div>
    <div class="ms">${esc(x.summary)}</div>${kind !== "know" && x.action ? `<div class="ma">${esc(x.action)}</div>` : ""}`;
  if (kind === "know") return `<div class="mi know">${head}<div class="row"><span></span><button class="btn" data-mail-done="${esc(x.id)}">Got it</button></div></div>`;
  if (kind === "action") return `<div class="mi action">${head}<div class="row"><span></span><button class="btn" data-mail-done="${esc(x.id)}">Done</button></div></div>`;
  const dr = mailDraft[x.id] || {body: x.reply, all: x.reply_all};
  const others = [x.to, x.cc].filter(Boolean).join(", ");
  return `<div class="mi answer" data-mail="${esc(x.id)}">${head}
    <textarea data-mail-body aria-label="Reply to ${esc(x.from)}">${esc(dr.body)}</textarea>
    <div class="rcpt">To ${esc(x.from)} &lt;${esc(x.from_email)}&gt;${others ? ` · <label><input type="checkbox" data-mail-all ${dr.all ? "checked" : ""}> reply all</label> <span title="${esc(others)}">(${esc(others.length > 90 ? others.slice(0, 90) + "…" : others)})</span>` : ""}</div>
    <div class="row"><button class="btn pri" data-mail-send="${esc(x.id)}" ${D.mail.send_ready ? "" : "disabled title=\"Sending isn't set up yet\""}>Approve &amp; send</button>
      <button class="btn" data-mail-done="${esc(x.id)}" data-act="dismissed">Dismiss</button></div></div>`;
}
function renderMail(force) {
  const el = $("#mail"); if (!mailOpen || !D.mail) return;
  if (!force && el.contains(document.activeElement) && document.activeElement.matches("textarea")) return;   // never wipe a draft mid-edit
  const m = D.mail, open = {};
  el.querySelectorAll("details[data-k]").forEach((d) => open[d.dataset.k] = d.open);
  const status = [m.last_poll ? `Checked ${ago(m.last_poll)}` : "Not polled yet",
    m.waiting ? `${m.waiting} waiting for triage${m.running ? " (working)" : ""}` : m.running ? "triaging" : "",
    m.failed ? `<span class="err">${m.failed} failed triage</span>` : "",
    m.error ? `<span class="err">${esc(m.error)}</span>` : "",
    m.send_ready ? "" : `<span class="err">Sending not set up: run <code>uv run resources/skills/workflow-ops/mail-triage/scripts/triage.py auth-send</code> once</span>`].filter(Boolean).join(" · ");
  const n = (c) => c.know.length + c.action.length + c.answer.length;
  let h = `<div class="kick">Mail</div><h1>What needs you?</h1><p class="lede">${status}</p>
    <div class="chips">${m.companies.map((c) => `<a data-mail-jump="${esc(c.name)}">${esc(c.name)}${c.answer.length ? `<b>${c.answer.length}</b>` : ""}</a>`).join("")}</div>`;
  for (const c of m.companies) {
    h += `<h2 id="mail-${esc(c.name.replace(/\W+/g, "-"))}">${esc(c.name)} <span class="meta">${n(c) ? `${c.answer.length} to answer · ${c.action.length} to do · ${c.know.length} to know` : "nothing open"}${c.pending ? ` · ${c.pending} in triage` : ""}</span></h2>`;
    const grp = (k, label, xs, bulk) => {
      if (!xs.length) return "";
      const key = c.name + k, isOpen = open[key] ?? (k !== "know" || xs.length <= 3);
      return `<details data-k="${esc(key)}" ${isOpen ? "open" : ""}><summary class="grp">${label} (${xs.length})${bulk ? `<a data-mail-bulk="${esc(xs.map((x) => x.id).join(","))}">mark all read</a>` : ""}</summary>${xs.map((x) => mailItem(x, k)).join("")}</details>`;
    };
    h += grp("know", "To know", c.know, true) + grp("action", "Action needed", c.action) + grp("answer", "Answer needed", c.answer);
  }
  el.innerHTML = h;
}
const mailInput = (e) => {
  const card = e.target.closest("[data-mail]"); if (!card) return;
  mailDraft[card.dataset.mail] = {body: card.querySelector("[data-mail-body]").value, all: !!card.querySelector("[data-mail-all]")?.checked};
};
const mailClick = async (e) => {
  const jump = e.target.closest("[data-mail-jump]");
  if (jump) return document.getElementById("mail-" + jump.dataset.mailJump.replace(/\W+/g, "-"))?.scrollIntoView({behavior: "smooth"});
  const bulk = e.target.closest("[data-mail-bulk]");
  if (bulk) { e.preventDefault(); await Promise.all(bulk.dataset.mailBulk.split(",").map((id) => post(`/api/mail/${id}/done`, {action: "read"}))); return loadMail(true); }
  const done = e.target.closest("[data-mail-done]");
  if (done) { await post(`/api/mail/${done.dataset.mailDone}/done`, {action: done.dataset.act || "done"}); delete mailDraft[done.dataset.mailDone]; return loadMail(true); }
  const send = e.target.closest("[data-mail-send]");
  if (!send) return;
  const card = send.closest("[data-mail]"), id = send.dataset.mailSend;
  const body = card.querySelector("[data-mail-body]").value, all = !!card.querySelector("[data-mail-all]")?.checked;
  const x = D.mail.companies.flatMap((c) => c.answer).find((y) => y.id === id);
  if (/\[confirm:/i.test(body)) return alert("The reply still has a [confirm: …] placeholder. Fill it in first.");
  if (!confirm(`Send this reply as you to ${x.from} <${x.from_email}>${all ? " and everyone on the thread" : ""}?`)) return;
  send.disabled = true; send.textContent = "Sending…";
  const r = await post(`/api/mail/${id}/send`, {body, reply_all: all});
  if (!r.ok) { send.disabled = false; send.textContent = "Approve & send"; return alert((await r.json()).detail || "Send failed."); }
  delete mailDraft[id]; toast("Sent", `Reply to ${x.from}`); loadMail(true);
};
for (const el of [$("#mail"), $("#item")]) { el.addEventListener("input", mailInput); el.addEventListener("click", mailClick); }

// Data
// =====================================================================
function renderAll() { renderFocus(); renderStars(); renderIsland(); renderGlance(); renderCanvas(); renderPlans(); syncModes(); if (itemOpen) renderItem(); }
async function loadMeetings() {
  D.meetings = await (await fetch("/api/meetings")).json();
  if (D.lastSync && D.meetings.synced_at !== D.lastSync) D.blip = {k: "cos", until: Date.now() + 1500};   // the Chief of Staff's tick
  D.lastSync = D.meetings.synced_at; renderAll();
}
async function loadSlack() {
  try { const s = await (await fetch("/api/slack-intel")).json(), top = s.briefings[0]?.path;
    if (D.slack && top && top !== D.slack.briefings[0]?.path) { D.blip = {k: "cos", until: Date.now() + 1500}; toast("Chief of Staff", "New Slack digest: something worth knowing."); }
    D.slack = s; renderStars();
  } catch {}
}
async function loadBriefing() {
  const meta = await (await fetch("/api/briefings")).json();
  D.briefRunning = meta.running;
  if (meta.dates.length) { const r = await (await fetch(`/api/briefings/${meta.dates[0]}`)).json(); D.brief = r.briefing; D.briefFb = r.feedback; D.briefPod = r.podcast; D.briefPodRunning = r.podcast_running; D.briefPage = r.page; D.briefLearn = r.learn || []; }
  renderAll();
}
// A task's deliverable plus its files, each printable to PDF or voiceable to MP3 (scripts/render.py).
let reportPoll = null;
async function showReport(id, title, keepScroll) {
  clearTimeout(reportPoll);
  const r = await fetch(`/api/tasks/${id}/report`); if (!r.ok) return alert("Report not found.");
  const j = await r.json(), file = (p) => `/api/tasks/${id}/file?path=${encodeURIComponent(p)}`;
  const rows = (j.files || []).map((f) => `<div class="row" style="margin:4px 0"><span style="flex:1">${esc(f.name)}</span>
    ${f.rendering ? `<span class="meta">rendering…</span>` : ""}
    ${f.pdf ? `<a class="btn" href="${file(f.path.replace(/\.\w+$/, ".pdf"))}" target="_blank" rel="noopener">PDF</a>`
      : `<button class="btn" data-render="pdf" data-path="${esc(f.path)}" ${f.rendering ? "disabled" : ""}>Make PDF</button>`}
    ${f.mp3 ? `<button class="btn" data-play="${esc(file(f.path.replace(/\.md$/, ".mp3")))}" data-title="${esc(f.name)}">▶ Play</button>`
      : f.audio_ok ? `<button class="btn" data-render="audio" data-path="${esc(f.path)}" ${f.rendering ? "disabled" : ""}>Make audio</button>` : ""}</div>`).join("")
    // NotebookLM podcast / video asked for in the task (`media:`), made after the report by task_media.py.
    + (j.media || []).map((m) => `<div class="row" style="margin:4px 0;flex-wrap:wrap"><span style="flex:1">NotebookLM ${esc(m.label)}</span>
    ${m.path ? (m.kind === "video" ? `<video controls playsinline preload="none" style="width:100%;margin-top:6px" src="${esc(file(m.path))}"></video>`
        : `<button class="btn" data-play="${esc(file(m.path))}" data-title="${esc(title)}">▶ Play</button>`)
      : `<span class="meta">${m.status === "failed" ? `failed: ${esc(m.error || "")}` : "making… (10–30 min)"}</span>`}</div>`).join("");
  const body = $("#panel-body"), top = body.scrollTop, open = $("#panel").classList.contains("open");
  if (keepScroll && !open) return;  // closed while rendering: stop polling
  const fm = j.markdown.startsWith("---\n") ? j.markdown.slice(4, j.markdown.indexOf("\n---", 3)) : "";
  const pageLink = /^template:\s*\w/m.test(fm) ? ` · <a href="/page/${esc(j.path.replace(/^output\//, ""))}" target="_blank" rel="noopener">Open as page</a>` : "";
  openPanel(title, `<p class="meta">${esc(j.path)}${pageLink}</p>${rows ? `<div class="card" data-report="${esc(id)}" style="margin-bottom:14px">${rows}</div>` : ""}<div style="font:16px/1.6 var(--serif)">${md(j.markdown)}</div>`);
  if (keepScroll) body.scrollTop = top;
  if ((j.files || []).some((f) => f.rendering) || (j.media || []).some((m) => !m.path && m.status !== "failed")) reportPoll = setTimeout(() => showReport(id, title, true), 5000);
}
document.addEventListener("click", async (e) => {
  const rb = e.target.closest("[data-render]"), pb = e.target.closest("[data-play]");
  if (pb) return playAudio(pb.dataset.play, pb.dataset.title);
  if (!rb) return;
  const id = rb.closest("[data-report]").dataset.report, t = D.tasks.find((x) => x.id === id);
  const r = await post(`/api/tasks/${id}/render`, {kind: rb.dataset.render, path: rb.dataset.path});
  if (!r.ok) return alert((await r.json()).detail || "Render failed to start.");
  setTimeout(() => showReport(id, t.title, true), 800);
});
// One audio element for the whole page, so playback survives panel re-renders and closing.
function playPodcast(b) { playAudio(`/api/briefings/${b.date}/podcast`, `Briefing · ${b.date}`, "Maya & Ben"); }
function playAudio(src, title, artist) {
  let bar = $("#podbar");
  if (!bar) {
    bar = document.createElement("div"); bar.id = "podbar";
    bar.innerHTML = `<audio controls preload="metadata"></audio><button class="btn" aria-label="Close player">✕</button>`;
    bar.querySelector("button").onclick = () => { bar.querySelector("audio").pause(); bar.remove(); };
    document.body.append(bar);
  }
  const a = bar.querySelector("audio");
  if (!a.src.endsWith(src)) a.src = src;
  if ("mediaSession" in navigator) navigator.mediaSession.metadata = new MediaMetadata({title, artist: artist || "cbrain", album: "cbrain"});
  a.play();
}
async function loadLoops() { D.loops = await (await fetch("/api/loops")).json(); renderAll(); }
async function loadTasks() {
  D.tasks = await (await fetch("/api/tasks")).json();
  const prev = D.taskStates; D.taskStates = Object.fromEntries(D.tasks.map((t) => [t.id, t.state]));
  if (prev) for (const t of D.tasks) {
    if (prev[t.id] === t.state || !["needs_input", "done", "failed", "lost"].includes(t.state)) continue;
    const body = t.state === "needs_input" ? t.question : t.state === "done" ? t.summary : (t.error || "Stopped.");
    const who = t.kind === "plan" ? "Your team" : "Researcher";
    const title = `${who} · ${t.title}${t.state === "needs_input" ? " needs you" : t.state === "done" ? " is ready" : " stopped"}`;
    D.blip = {k: t.kind === "plan" ? "cos" : "res", until: Date.now() + 1500}; toast(title, body || "");
    if ("Notification" in window && Notification.permission === "granted" && document.hidden && !quietNow()) new Notification(title, {body: body || ""});
  }
  const typing = document.activeElement?.matches?.("#panel input[data-task-act='text']") && document.activeElement.value;
  if (!typing) renderAll();
  renderPlan();
}

const refreshAll = () => { loadMeetings(); loadBriefing(); loadLoops(); loadTasks(); };

goLive(); refreshAll(); connect(new URLSearchParams(location.search).get("s") || remembered()); V.render();   // ?s=<session id> reopens a conversation; else the last one
{ // ?view=plans|mail|library|ideas|situation and ?p=<plan id> open a place directly; otherwise the stage as it stands
  const qs = new URLSearchParams(location.search), v = qs.get("view"), pid = qs.get("p");
  if (pid) loadTasks().then(() => stageTo(`task:${pid}`));
  else if (["plans", "mail", "library", "ideas", "situation"].includes(v)) setTimeout(() => stageTo(`view:${v}`), 300);
  else fetch("/api/stage").then((r) => r.json()).then(applyStage).catch(() => setMode("today"));
}
loadJarvis(); setInterval(() => !document.hidden && loadJarvis(), 15000);
loadIdeas();
setInterval(() => !document.hidden && ideasOpen && loadIdeas(), 10000);    // a dive's progress, while you look
setInterval(() => !document.hidden && !ideasOpen && loadIdeas(), 60000);   // the badge
loadMail();
setInterval(() => !document.hidden && mailOpen && loadMail(), 15000);
setInterval(() => !document.hidden && !mailOpen && loadMail(), 60000);   // the badge
setInterval(() => !document.hidden && loadMeetings(), 60000);
loadSlack(); setInterval(() => !document.hidden && loadSlack(), 60000);
setInterval(() => !document.hidden && (loadBriefing(), loadLoops()), 300000);
setInterval(loadTasks, 5000);
setInterval(() => { renderFocus(); renderGlance(); }, 30000);   // countdown
