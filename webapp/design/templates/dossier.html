<!doctype html>
<html lang="{{lang}}">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; img-src data: https:; media-src 'self' file:">
<title>{{title}}</title>
<style>{{css}}</style>
</head>
<body class="t-dossier">
<main class="page">
<header class="mast"><div class="kicker">{{label}}</div><h1>{{title}}</h1>{{subtitle}}<div class="meta">{{meta}}</div></header>
<div class="cols side-l">
  <aside class="sticky">{{slot:profile}}{{slot:asks}}</aside>
  <article class="measure">
    {{slot:lead}}
    {{body}}
    {{slot:unknowns}}
    {{slot:sources}}
  </article>
</div>
</main>
</body>
</html>
