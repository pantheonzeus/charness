name: Pages

# Builds the documentation site (docs/) with --strict on every pull request that touches it, and
# deploys it to GitHub Pages on a push to main. The site reads Charter, Soul, the HarnessCard, the
# changelog and the skill index at build time (docs/hooks.py), so those paths trigger it too.

on:
  push:
    branches: [main]
    paths: [docs/**, resources/skills/**, Charter.md, Soul.md, HARNESSCARD.md, CHANGELOG.md, .claude/agents/**, .claude/hooks/tests/**, .github/workflows/pages.yml]
  pull_request:
    paths: [docs/**, resources/skills/**, Charter.md, Soul.md, HARNESSCARD.md, CHANGELOG.md, .github/workflows/pages.yml]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - name: Build (strict)
        run: uv run --no-project --python 3.12 --with-requirements docs/requirements.txt mkdocs build --strict -f docs/mkdocs.yml
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
