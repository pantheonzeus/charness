# charness documentation site — built by .github/workflows/pages.yml, published to GitHub Pages.
# Local preview: uv run --no-project --with-requirements docs/requirements.txt mkdocs serve -f docs/mkdocs.yml
site_name: charness
site_description: An open-source governed agent harness for Claude Code. Policy is written as plain-language documents, guardrails are enforced in code, and every run leaves a file trail.
site_url: https://pantheonzeus.github.io/charness/
repo_url: https://github.com/pantheonzeus/charness
repo_name: pantheonzeus/charness
edit_uri: edit/main/docs/content/
copyright: MIT licensed · The Lean Service Creation skills are CC BY-SA 4.0 (see NOTICE)

docs_dir: content
site_dir: ../site

theme:
  name: material
  custom_dir: overrides
  logo: assets/logo.svg
  favicon: assets/logo.svg
  font:
    text: Inter
    code: JetBrains Mono
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: custom
      accent: custom
      toggle: { icon: material/weather-night, name: Dark mode }
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: custom
      accent: custom
      toggle: { icon: material/weather-sunny, name: Light mode }
  icon:
    repo: fontawesome/brands/github
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.indexes
    - navigation.top
    - navigation.footer
    - navigation.instant
    - search.suggest
    - search.highlight
    - content.code.copy
    - content.action.edit
    - toc.follow

plugins:
  - search
  - privacy   # fonts and other external assets are downloaded at build time: the site makes no third-party requests

hooks:
  - hooks.py

extra_css:
  - assets/extra.css

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - toc: { permalink: true }
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.highlight: { anchor_linenums: true }
  - pymdownx.inlinehilite
  - pymdownx.tabbed: { alternate_style: true }
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg

nav:
  - Home: index.md
  - Get started:
      - Quickstart: get-started/quickstart.md
      - Make it yours: get-started/make-it-yours.md
  - Concepts:
      - Architecture: concepts/architecture.md
      - Anatomy of a session: concepts/session.md
      - Skills: concepts/skills.md
      - State, memory and the vault: concepts/state-and-memory.md
      - Headless jobs: concepts/headless-jobs.md
  - Governance:
      - Guardrails: governance/guardrails.md
      - Untrusted ingest: governance/untrusted-ingest.md
      - Evaluation: governance/evaluation.md
      - HarnessCard: governance/harnesscard.md
  - Guides:
      - Write a skill: guides/write-a-skill.md
      - Add a headless job: guides/add-a-headless-job.md
  - Reference:
      - Skill catalog: reference/skills.md
      - Charter: reference/charter.md
      - Soul: reference/soul.md
      - Changelog: reference/changelog.md
  - FAQ: faq.md
